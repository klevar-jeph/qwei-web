<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }

  .card {
    background: var(--card); width: 100%; max-width: 400px; border-radius: 28px;
    padding: 32px 24px; box-shadow: 0 30px 70px rgba(0,0,0,.4); text-align: center;

  .top { display: flex; align-items: center; justify-content: center; gap: 10px; }

  p { margin-top: 10px; color: var(--ink-soft); }
  .cta {

    background: var(--emerald); color: #fff; text-decoration: none; font-size: 15px; font-weight: 600; border-radius: 14px;
  }
